<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喵汪小镇 · 猫猫技术验证</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a9d4e8; font-family: -apple-system, "PingFang SC", sans-serif; }
      #view { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: pointer; }
      #view.painting { cursor: crosshair; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100vh - 24px); overflow-y: auto;
        background: rgba(255, 251, 242, 0.94); border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(60, 40, 20, 0.18);
        font-size: 13px; color: #4a3a2c;
      }
      #panel.hidden { display: none; }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #panel h2 { font-size: 12px; margin: 12px 0 6px; color: #8a6a4a; font-weight: 600; }
      #panel .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
      #panel label { display: flex; align-items: center; gap: 4px; }
      #panel button {
        border: 1px solid #d8c4a6; background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: #4a3a2c;
      }
      #panel button.active { background: #f0b45a; border-color: #d99a3a; color: #fff; }
      #panel select, #panel input[type=range] { flex: 1; }
      #status { font-size: 12px; color: #7a6450; margin-top: 4px; }
      #coat { width: 256px; height: 256px; image-rendering: pixelated; border: 1px solid #d8c4a6; background: #fff; }
      #swatches { display: flex; gap: 4px; flex-wrap: wrap; }
      #swatches span { width: 18px; height: 18px; border-radius: 3px; border: 2px solid #fff; box-shadow: 0 0 0 1px #d8c4a6; cursor: pointer; }
      #swatches span.active { box-shadow: 0 0 0 2px #d99a3a; }
      .hint { font-size: 11px; color: #9a8470; line-height: 1.5; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <h1>喵汪小镇 · 猫猫技术验证</h1>
      <div class="hint">一套母版骨骼 + 一份 DNA = 一只猫。点猫会歪头开心，鼠标移动它会看你。</div>
      <div id="status"></div>

      <h2>宠物（只换 DNA，不换动作）</h2>
      <div class="row"><select id="pet"></select></div>

      <h2>动作（全猫共用）</h2>
      <div class="row" id="actions"></div>

      <h2>画风</h2>
      <div class="row"><label>像素倍率 <input id="scale" type="range" min="1" max="6" step="1" /></label></div>
      <div class="row"><label>镜头缩放 <input id="zoom" type="range" min="2.5" max="10" step="0.1" /></label></div>
      <div class="row">
        <label><input id="outline" type="checkbox" checked /> 描边</label>
        <label><input id="posterize" type="checkbox" /> 色阶量化</label>
        <label><input id="follow" type="checkbox" checked /> 镜头跟随</label>
      </div>

      <h2>印记（模型表面贴图）</h2>
      <div class="row">
        <button id="paint">在猫身上绘制</button>
        <label>笔刷 <input id="brush" type="range" min="1" max="6" step="1" value="2" /></label>
      </div>
      <div class="row" id="swatches"></div>
      <div class="row"><input id="color" type="color" value="#f3eee4" /> <span class="hint">自定义颜色</span></div>
      <div class="row">
        <button id="rebake">重新烘焙</button>
        <button id="savePng">导出印记 PNG</button>
        <button id="saveGlb">导出母版 GLB</button>
      </div>
      <div id="coatWrap"></div>
      <div class="hint" id="gates"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
